name: Compile RootHide DEB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize and check release metadata
        id: version
        run: |
          python3 scripts/version.py sync
          python3 scripts/version.py check
          echo "version=$(python3 scripts/version.py print)" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target: [roothide]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      THEOS: ${{ github.workspace }}/.build/toolchain
      ADS_SDK_DIR: ${{ github.workspace }}/.build/sdks
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Roothide-capable Theos
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          ref: 958fea4f779943505b15b93c88bb4db8d97b346d
          submodules: recursive
          path: .build/toolchain
      - name: Checkout pinned patched SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          ref: 0222fd5413cf4b9af096f37b4621afa2688572f7
          path: .build/sdks
          sparse-checkout: iPhoneOS16.5.sdk
      - name: Prepare macOS packaging and signing tools
        run: |
          brew install ldid dpkg xz
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Build roothide target
        env:
          ADS_TARGET: ${{ matrix.target }}
        run: |
          test "$(python3 scripts/version.py print)" = "$RELEASE_VERSION"
          bash scripts/build_target.sh "$ADS_TARGET"
      - name: Upload the verified product
        uses: actions/upload-artifact@v4
        with:
          name: AntiDarkSword-${{ matrix.target }}
          path: output/*
          if-no-files-found: error
